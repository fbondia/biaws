version: 2
updates:
  - package-ecosystem: npm
    directory: /biaws-api
    schedule:
      interval: weekly
    groups:
      api-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /biaws-ui
    schedule:
      interval: weekly
    groups:
      ui-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
