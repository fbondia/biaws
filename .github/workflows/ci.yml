name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/check-documentation.mjs
      - run: node scripts/release-manifest.mjs check

  api:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      BIAWS_INTEGRATION_MONGO_URI: mongodb://127.0.0.1:27017/biaws_ci
      BIAWS_HTTP_INTEGRATION: "1"
    defaults:
      run:
        working-directory: biaws-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: biaws-api/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm run openapi:check
      - run: npm run build
      - run: npm test
      - run: npm run test:compiled
      - run: npm audit --omit=dev --audit-level=high

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: biaws-ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: biaws-ui/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run check:css
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: biaws-mcp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: biaws-mcp/package-lock.json
      - run: npm ci
      - run: npm run release:check
      - run: npm audit --omit=dev --audit-level=high
      - name: Install the packed MCP and exercise the handshake
        shell: bash
        run: |
          expected_version="$(node -p "require('./package.json').version")"
          package_file="biaws-mcp-${expected_version}.tgz"
          npm pack --pack-destination "${RUNNER_TEMP}"
          install_prefix="${RUNNER_TEMP}/biaws-mcp-global"
          npm install --global --prefix "${install_prefix}" "${RUNNER_TEMP}/${package_file}"
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | "${install_prefix}/bin/biaws-mcp" > "${RUNNER_TEMP}/biaws-mcp-handshake.jsonl"
          grep -F '"id":2' "${RUNNER_TEMP}/biaws-mcp-handshake.jsonl"
          grep -F '"tools":[' "${RUNNER_TEMP}/biaws-mcp-handshake.jsonl"

  module-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            biaws-api/package-lock.json
            biaws-mcp/package-lock.json
      - run: npm ci --prefix biaws-api
      - run: npm ci --prefix biaws-mcp
      - run: node scripts/test-integration.mjs

  cli:
    name: CLI (Node ${{ matrix.node-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [20.19.0, 22]
    defaults:
      run:
        working-directory: biaws-cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: biaws-cli/package-lock.json
      - run: npm ci
      - run: npm run release:check
      - run: npm audit --omit=dev --audit-level=high
      - name: Install the packed CLI and exercise the shebang
        shell: bash
        run: |
          expected_version="$(node -p "require('./package.json').version")"
          package_file="biaws-${expected_version}.tgz"
          npm pack --pack-destination "${RUNNER_TEMP}"
          install_prefix="${RUNNER_TEMP}/biaws-global"
          npm install --global --prefix "${install_prefix}" "${RUNNER_TEMP}/${package_file}"
          "${install_prefix}/bin/biaws" --help >"${RUNNER_TEMP}/biaws-help.txt" 2>"${RUNNER_TEMP}/biaws-help.err"
          "${install_prefix}/bin/biaws" --version >"${RUNNER_TEMP}/biaws-version.txt" 2>"${RUNNER_TEMP}/biaws-version.err"
          test ! -s "${RUNNER_TEMP}/biaws-help.err"
          test ! -s "${RUNNER_TEMP}/biaws-version.err"
          for topic in admin config workspace; do
            grep -Eq "^  ${topic}[[:space:]]" "${RUNNER_TEMP}/biaws-help.txt"
          done
          "${install_prefix}/bin/biaws" workspace agent configure codex --help > /dev/null
          "${install_prefix}/bin/biaws" workspace agent doctor --help > /dev/null
          grep -F "biaws/${expected_version}" "${RUNNER_TEMP}/biaws-version.txt"

  monitor-executor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: biaws-monitor-executor
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: biaws-monitor-executor/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install the checkout MCP for the agent bootstrap
        shell: bash
        run: |
          expected_version="$(node -p "require('./biaws-mcp/package.json').version")"
          npm ci --prefix biaws-mcp
          npm pack ./biaws-mcp --pack-destination "${RUNNER_TEMP}"
          npm install --no-save --package-lock=false --ignore-scripts \
            "${RUNNER_TEMP}/biaws-mcp-${expected_version}.tgz"
      - name: Bootstrap from a clean checkout
        env:
          BIAWS_BOOTSTRAP_ADMIN_EMAIL: ci@example.test
          BIAWS_BOOTSTRAP_ADMIN_NAME: CI
          BIAWS_BOOTSTRAP_ADMIN_PASSWORD: ci-validation-password
        run: |
          mkdir -p /tmp/biaws-codex-project
          ./scripts/setup-local.sh \
            --instance ci \
            --client codex \
            --project /tmp/biaws-codex-project
      - name: Verify seed idempotence and public endpoints
        run: |
          docker compose \
            --env-file instances/ci/.env \
            --project-name biaws-ci \
            exec -T api npm run seed:demo
          api_port="$(sed -n 's/^BIAWS_API_PORT=//p' instances/ci/.env)"
          ui_port="$(sed -n 's/^BIAWS_UI_PORT=//p' instances/ci/.env)"
          curl --fail --silent --show-error "http://127.0.0.1:${api_port}/api/health"
          curl --fail --silent --show-error "http://127.0.0.1:${ui_port}/" > /dev/null
      - name: Verify active monitoring profile and telemetry
        run: |
          docker compose \
            --env-file instances/ci/.env \
            --project-name biaws-ci \
            --profile active-monitoring \
            up -d --build --wait monitor-executor
          docker compose \
            --env-file instances/ci/.env \
            --project-name biaws-ci \
            exec -T monitor-executor node -e \
            "fetch('http://127.0.0.1:3110/health/ready').then(r=>{if(!r.ok)process.exit(1)})"
          docker compose \
            --env-file instances/ci/.env \
            --project-name biaws-ci \
            exec -T monitor-executor node -e \
            "fetch('http://127.0.0.1:3110/metrics').then(r=>r.text()).then(t=>{if(!t.includes('biaws_monitor_executor_polls_total'))process.exit(1)})"
          executor_key="$(cat instances/ci/monitor-secrets/executor-api-key)"
          if docker compose \
            --env-file instances/ci/.env \
            --project-name biaws-ci \
            logs --no-color monitor-executor | grep -F -- "${executor_key}"; then
            echo "Executor API key leaked into logs" >&2
            exit 1
          fi
      - name: Verify release manifest and legacy update
        run: |
          npm ci --prefix biaws-cli
          node biaws-cli/bin/biaws.js admin instance update ci --check --json > "${RUNNER_TEMP}/release-check.json"
          node -e 'const s=require(process.argv[1]); if(s.updateRequired || s.legacyInstallation) process.exit(1)' "${RUNNER_TEMP}/release-check.json"
          mv instances/ci/release.json "${RUNNER_TEMP}/applied-release.json"
          node biaws-cli/bin/biaws.js admin instance update ci --check --json > "${RUNNER_TEMP}/legacy-check.json"
          node -e 'const s=require(process.argv[1]); if(!s.updateRequired || !s.legacyInstallation) process.exit(1)' "${RUNNER_TEMP}/legacy-check.json"
          node biaws-cli/bin/biaws.js admin instance update ci --skip-backup --json
          node biaws-cli/bin/biaws.js admin instance update ci --json > "${RUNNER_TEMP}/unchanged.json"
          node -e 'const s=require(process.argv[1]); if(s.updated || s.updateRequired || s.backupCreated) process.exit(1)' "${RUNNER_TEMP}/unchanged.json"
          node --input-type=module -e 'import assert from "node:assert/strict"; import fs from "node:fs"; assert.deepEqual(JSON.parse(fs.readFileSync("release.json")), JSON.parse(fs.readFileSync("instances/ci/release.json")))'
      - name: Collect service logs
        if: failure()
        run: >-
          docker compose --env-file instances/ci/.env
          --project-name biaws-ci logs --no-color
      - name: Remove isolated services and volumes
        if: always()
        run: >-
          docker compose --env-file instances/ci/.env
          --project-name biaws-ci down --volumes --remove-orphans
