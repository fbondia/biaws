name: biaws

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - ${BIAWS_MONGO_DATA_PATH:-mongo-data}:/data/db
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    init: true
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/biaws
      MONGO_DB: ${MONGO_DB:-biaws}
      ISSUE_API_HOST: 0.0.0.0
      ISSUE_API_PORT: 3100
      ISSUE_API_MAX_ATTACHMENT_BYTES: ${ISSUE_API_MAX_ATTACHMENT_BYTES:-52428800}
      ISSUE_API_MAX_JSON_BYTES: ${ISSUE_API_MAX_JSON_BYTES:-4194304}
      ISSUE_API_RATE_LIMIT_ENABLED: ${ISSUE_API_RATE_LIMIT_ENABLED:-true}
      ISSUE_API_RATE_LIMIT_WINDOW_SECONDS: ${ISSUE_API_RATE_LIMIT_WINDOW_SECONDS:-60}
      ISSUE_API_RATE_LIMIT_MAX_REQUESTS: ${ISSUE_API_RATE_LIMIT_MAX_REQUESTS:-300}
      BETTER_AUTH_RATE_LIMIT_ENABLED: ${BETTER_AUTH_RATE_LIMIT_ENABLED:-true}
      BETTER_AUTH_RATE_LIMIT_WINDOW_SECONDS: ${BETTER_AUTH_RATE_LIMIT_WINDOW_SECONDS:-10}
      BETTER_AUTH_RATE_LIMIT_MAX_REQUESTS: ${BETTER_AUTH_RATE_LIMIT_MAX_REQUESTS:-100}
      ISSUE_API_KEY_RATE_LIMIT_ENABLED: ${ISSUE_API_KEY_RATE_LIMIT_ENABLED:-true}
      ISSUE_API_KEY_RATE_LIMIT_WINDOW_SECONDS: ${ISSUE_API_KEY_RATE_LIMIT_WINDOW_SECONDS:-3600}
      ISSUE_API_KEY_RATE_LIMIT_MAX_REQUESTS: ${ISSUE_API_KEY_RATE_LIMIT_MAX_REQUESTS:-1000}
      ISSUE_DIR: /data/issues
      REQUEST_DIR: /data/requests
      DOCUMENT_DIR: /data/documents
      BIAWS_SECRETS_PROVIDER: local
      BIAWS_SECRETS_DIR: /data/secrets
      BIAWS_SECRETS_KEY_FILE: /run/secrets/biaws-master-key
      BIAWS_SECRETS_MAX_FILE_BYTES: ${BIAWS_SECRETS_MAX_FILE_BYTES:-5242880}
      ATTACHMENT_STORAGE_PROVIDER: local
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Execute ./scripts/bootstrap.sh para configurar o ambiente}
      BETTER_AUTH_URL: ${BIAWS_PUBLIC_URL:-http://localhost:4400}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BIAWS_TRUSTED_ORIGINS:-http://localhost:4400,http://127.0.0.1:4400}
      BETTER_AUTH_TRUSTED_PROXIES: ${BETTER_AUTH_TRUSTED_PROXIES:-}
      BETTER_AUTH_SECURE_COOKIES: ${BETTER_AUTH_SECURE_COOKIES:-false}
      ISSUE_API_LOG_HEALTH_REQUESTS: ${ISSUE_API_LOG_HEALTH_REQUESTS:-false}
    ports:
      - "${ISSUE_API_PORT:-3100}:3100"
    volumes:
      - ${BIAWS_ISSUE_FILES_PATH:-issue-files}:/data/issues
      - ${BIAWS_REQUEST_FILES_PATH:-request-files}:/data/requests
      - ${BIAWS_DOCUMENT_FILES_PATH:-procedure-files}:/data/documents
      - ${BIAWS_SECRET_FILES_PATH:-secret-files}:/data/secrets
    secrets:
      - source: biaws_master_key
        target: biaws-master-key
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3100/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  monitor-executor:
    profiles: ["active-monitoring"]
    build:
      context: .
      dockerfile: docker/monitor-executor.Dockerfile
    init: true
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      BIAWS_MONITOR_EXECUTOR_ENABLED: ${BIAWS_MONITOR_EXECUTOR_ENABLED:-true}
      BIAWS_MONITOR_EXECUTOR_API_URL: http://api:3100
      BIAWS_MONITOR_EXECUTOR_API_KEY: ${BIAWS_MONITOR_EXECUTOR_API_KEY:-}
      BIAWS_MONITOR_EXECUTOR_WORKSPACE_ID: ${BIAWS_MONITOR_EXECUTOR_WORKSPACE_ID:-}
      BIAWS_MONITOR_EXECUTOR_CONCURRENCY: ${BIAWS_MONITOR_EXECUTOR_CONCURRENCY:-4}
      BIAWS_MONITOR_EXECUTOR_EVIDENCE_MAX_BYTES: ${BIAWS_MONITOR_EXECUTOR_EVIDENCE_MAX_BYTES:-8000}
      BIAWS_MONITOR_REST_ALLOWED_HOSTS: ${BIAWS_MONITOR_REST_ALLOWED_HOSTS:-}
      BIAWS_MONITOR_REST_ALLOWED_METHODS: ${BIAWS_MONITOR_REST_ALLOWED_METHODS:-GET,HEAD}
      BIAWS_MONITOR_REST_ALLOW_PRIVATE_ADDRESSES: ${BIAWS_MONITOR_REST_ALLOW_PRIVATE_ADDRESSES:-false}
      BIAWS_MONITOR_REST_MAX_REDIRECTS: ${BIAWS_MONITOR_REST_MAX_REDIRECTS:-3}
      BIAWS_MONITOR_REFERENCE_ENV_MAP: ${BIAWS_MONITOR_REFERENCE_ENV_MAP:-}
      BIAWS_MONITOR_SHELL_ROOT: ${BIAWS_MONITOR_SHELL_ROOT:-/opt/biaws-monitor-scripts}
      BIAWS_MONITOR_SHELL_SCRIPTS: ${BIAWS_MONITOR_SHELL_SCRIPTS:-}
      BIAWS_MONITOR_EXECUTOR_HEALTH_HOST: 0.0.0.0
      BIAWS_MONITOR_EXECUTOR_HEALTH_PORT: 3110
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3110/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  ui:
    build:
      context: .
      dockerfile: docker/ui.Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      ISSUE_API_MAX_ATTACHMENT_BYTES: ${ISSUE_API_MAX_ATTACHMENT_BYTES:-52428800}
    ports:
      - "${ISSUE_UI_PORT:-4400}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mongo-data:
  issue-files:
  request-files:
  procedure-files:
  secret-files:

secrets:
  biaws_master_key:
    file: ${BIAWS_SECRETS_KEY_PATH:-.secrets-master-key}
