services:
  executor:
    image: ${BIAWS_MONITOR_EXECUTOR_IMAGE:?Configure BIAWS_MONITOR_EXECUTOR_IMAGE}
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BIAWS_MONITOR_EXECUTOR_ENABLED: ${BIAWS_MONITOR_EXECUTOR_ENABLED:-true}
      BIAWS_MONITOR_EXECUTOR_API_URL: ${BIAWS_MONITOR_EXECUTOR_API_URL:-http://api:3100}
      BIAWS_MONITOR_EXECUTOR_API_KEY_FILE: ${BIAWS_MONITOR_EXECUTOR_API_KEY_FILE:-/run/secrets/executor-api-key}
      BIAWS_MONITOR_EXECUTOR_WORKSPACE_ID: ${BIAWS_MONITOR_EXECUTOR_WORKSPACE_ID:?Configure BIAWS_MONITOR_EXECUTOR_WORKSPACE_ID}
      BIAWS_MONITOR_EXECUTOR_ID: ${BIAWS_MONITOR_EXECUTOR_ID:-}
      BIAWS_MONITOR_EXECUTOR_CONCURRENCY: ${BIAWS_MONITOR_EXECUTOR_CONCURRENCY:-4}
      BIAWS_MONITOR_EXECUTOR_POLL_INTERVAL_MS: ${BIAWS_MONITOR_EXECUTOR_POLL_INTERVAL_MS:-15000}
      BIAWS_MONITOR_EXECUTOR_LEASE_SECONDS: ${BIAWS_MONITOR_EXECUTOR_LEASE_SECONDS:-60}
      BIAWS_MONITOR_EXECUTOR_RENEW_INTERVAL_MS: ${BIAWS_MONITOR_EXECUTOR_RENEW_INTERVAL_MS:-20000}
      BIAWS_MONITOR_EXECUTOR_REQUEST_TIMEOUT_MS: ${BIAWS_MONITOR_EXECUTOR_REQUEST_TIMEOUT_MS:-10000}
      BIAWS_MONITOR_EXECUTOR_RETRY_ATTEMPTS: ${BIAWS_MONITOR_EXECUTOR_RETRY_ATTEMPTS:-4}
      BIAWS_MONITOR_EXECUTOR_RETRY_BASE_MS: ${BIAWS_MONITOR_EXECUTOR_RETRY_BASE_MS:-500}
      BIAWS_MONITOR_EXECUTOR_RETRY_MAX_MS: ${BIAWS_MONITOR_EXECUTOR_RETRY_MAX_MS:-15000}
      BIAWS_MONITOR_EXECUTOR_SHUTDOWN_GRACE_MS: ${BIAWS_MONITOR_EXECUTOR_SHUTDOWN_GRACE_MS:-30000}
      BIAWS_MONITOR_EXECUTOR_READINESS_MAX_AGE_MS: ${BIAWS_MONITOR_EXECUTOR_READINESS_MAX_AGE_MS:-60000}
      BIAWS_MONITOR_EXECUTOR_EVIDENCE_MAX_BYTES: ${BIAWS_MONITOR_EXECUTOR_EVIDENCE_MAX_BYTES:-8000}
      BIAWS_MONITOR_REST_ALLOWED_HOSTS: ${BIAWS_MONITOR_REST_ALLOWED_HOSTS:-}
      BIAWS_MONITOR_REST_ALLOWED_METHODS: ${BIAWS_MONITOR_REST_ALLOWED_METHODS:-GET,HEAD}
      BIAWS_MONITOR_REST_ALLOW_PRIVATE_ADDRESSES: ${BIAWS_MONITOR_REST_ALLOW_PRIVATE_ADDRESSES:-false}
      BIAWS_MONITOR_REST_MAX_REDIRECTS: ${BIAWS_MONITOR_REST_MAX_REDIRECTS:-3}
      BIAWS_MONITOR_REFERENCE_FILE_MAP: ${BIAWS_MONITOR_REFERENCE_FILE_MAP:-{}}
      BIAWS_MONITOR_REFERENCE_FILE_ROOT: /run/secrets
      BIAWS_MONITOR_SHELL_ROOT: /opt/biaws-monitor-scripts
      BIAWS_MONITOR_SHELL_SCRIPTS: ${BIAWS_MONITOR_SHELL_SCRIPTS:-{}}
      BIAWS_MONITOR_EXECUTOR_HEALTH_HOST: 0.0.0.0
      BIAWS_MONITOR_EXECUTOR_HEALTH_PORT: 3110
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - ${BIAWS_MONITOR_WORKSPACE_DIR:?Configure BIAWS_MONITOR_WORKSPACE_DIR}/secrets:/run/secrets:ro
      - ${BIAWS_MONITOR_WORKSPACE_DIR:?Configure BIAWS_MONITOR_WORKSPACE_DIR}/scripts:/opt/biaws-monitor-scripts:ro
    networks:
      - biaws-api
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3110/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    labels:
      com.bondia.biaws.monitoring.workspace: ${BIAWS_MONITOR_EXECUTOR_WORKSPACE_ID}

networks:
  biaws-api:
    external: true
    name: ${BIAWS_MONITOR_API_NETWORK:?Configure BIAWS_MONITOR_API_NETWORK}
