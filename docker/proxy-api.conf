# Included inside a location. Canonical scheme is operator-configured; never trust
# an arbitrary client X-Forwarded-Proto header.
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Proto ${BIAWS_PUBLIC_SCHEME};

